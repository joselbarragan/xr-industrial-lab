<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio XR Multiplataforma - A-Frame</title>
  <!-- Librería A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>

  <style>
    /* Panel de opciones flotante totalmente centrado */
    #ui-container {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.25);
      width: fit-content;
      max-width: 92vw;
      flex-wrap: wrap;
    }

    /* Estilo general para todos los botones */
    .ui-btn {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ESTADO SELECCIONADO / ACTIVO (Resaltado en azul) */
    .ui-btn.active {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.8) !important;
      transform: scale(1.04);
    }

    .ui-btn:active {
      transform: scale(0.96);
    }

    /* Botón especial para Modo VR en rojo */
    .ui-btn-vr {
      background: #dc2626;
      color: #ffffff;
      border-color: #f87171;
    }

    /* Reubicación y agrandado del botón nativo de VR */
    .a-enter-vr-button {
      bottom: 20px !important;
      right: 20px !important;
      width: 55px !important;
      height: 55px !important;
      background-color: rgba(0, 0, 0, 0.8) !important;
      border-radius: 50% !important;
    }
  </style>
</head>
<body>

  <!-- PANEL CENTRADO DE OPCIONES -->
  <div id="ui-container">
    <button id="btn-ambos" class="ui-btn view-btn active" onclick="mostrarTodo()">Ver Ambos</button>
    <button id="btn-primitivas" class="ui-btn view-btn" onclick="mostrarPrimitivas()">Ver Primitivas</button>
    <button id="btn-cad" class="ui-btn view-btn" onclick="mostrarCAD()">Ver Modelo CAD</button>
    <button class="ui-btn ui-btn-vr" onclick="activarModoVR()">🥽 Modo VR</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    
    <!-- Carga del Modelo CAD (Fase 3) -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Entorno y Piso -->
    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>

    <!-- ZONA 1: PRIMITIVAS (Fase 2) -->
    <a-entity id="zona-primitivas" position="-3 0 -5" visible="true">
      <a-box position="-1 0.5 0" width="1.5" height="1" depth="4" color="#4CC3D9"></a-box>
      <a-cylinder position="1.5 1.5 0" radius="0.8" height="3" color="#FFC65D"></a-cylinder>
      <a-sphere position="1.5 3.2 0" radius="0.3" color="#EF2D5E"></a-sphere>
    </a-entity>

    <!-- ZONA 2: MODELO CAD GLB (Fase 3) -->
    <a-entity 
      id="zona-cad"
      gltf-model="#modeloIndustrial" 
      position="3 0 -5" 
      scale="1 1 1"
      rotation="0 0 0"
      visible="true">
    </a-entity>

    <!-- CÁMARA CENTRADA -->
    <a-entity id="rigCamera" position="0 1.6 2">
      <a-camera look-controls WASD-controls></a-camera>
    </a-entity>

  </a-scene>

  <!-- LÓGICA DE CONTROL Y ESTADO ACTIVO -->
  <script>
    const zonaPrimitivas = document.getElementById('zona-primitivas');
    const zonaCad = document.getElementById('zona-cad');
    const sceneEl = document.querySelector('a-scene');

    function setActiveButton(btnId) {
      // Quita la clase 'active' de todos los botones de vista
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      // Activa el botón presionado
      document.getElementById(btnId).classList.add('active');
    }

    function mostrarTodo() {
      zonaPrimitivas.setAttribute('visible', 'true');
      zonaCad.setAttribute('visible', 'true');
      setActiveButton('btn-ambos');
    }

    function mostrarPrimitivas() {
      zonaPrimitivas.setAttribute('visible', 'true');
      zonaCad.setAttribute('visible', 'false');
      setActiveButton('btn-primitivas');
    }

    function mostrarCAD() {
      zonaPrimitivas.setAttribute('visible', 'false');
      zonaCad.setAttribute('visible', 'true');
      setActiveButton('btn-cad');
    }

    function activarModoVR() {
      if (sceneEl) {
        sceneEl.enterVR();
      }
    }
  </script>

</body>
</html>
