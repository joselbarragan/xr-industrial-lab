<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laboratorio XR Multiplataforma - A-Frame</title>
  <!-- Librería A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>

  <style>
    /* Forzar pantalla completa sin desbordamientos */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
    }

    /* Panel de opciones centrado superior */
    #ui-container {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      padding: 8px 12px;
      border-radius: 14px;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: fit-content;
      max-width: 92vw;
      flex-wrap: wrap;
    }

    .ui-btn {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 11px;
      font-family: system-ui, -apple-system, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      white-space: nowrap;
    }

    .ui-btn.active {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.8) !important;
    }

    .ui-btn-vr {
      background: #dc2626;
      color: #ffffff;
      border-color: #f87171;
    }

    /* FORZAR UBICACIÓN Y VISIBILIDAD DEL BOTÓN VR NATIVO */
    .a-enter-vr {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 999999 !important;
    }

    .a-enter-vr-button {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      width: 55px !important;
      height: 55px !important;
      background-color: rgba(15, 23, 42, 0.9) !important;
      border: 2px solid #ffffff !important;
      border-radius: 50% !important;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
    }
  </style>
</head>
<body>

  <!-- PANEL DE SELECCIÓN DE VISTA -->
  <div id="ui-container">
    <button id="btn-ambos" class="ui-btn view-btn active" onclick="mostrarTodo()">Ver Ambos</button>
    <button id="btn-primitivas" class="ui-btn view-btn" onclick="mostrarPrimitivas()">Ver Primitivas</button>
    <button id="btn-cad" class="ui-btn view-btn" onclick="mostrarCAD()">Ver Modelo CAD</button>
    <button class="ui-btn ui-btn-vr" onclick="forzarIngresoVR()"> Entrar VR</button>
  </div>

  <!-- Escena A-Frame en pantalla completa -->
  <a-scene vr-mode-ui="enabled: true">
    
    <!-- Carga del Modelo CAD -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>

    <!-- Entorno y Piso -->
    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>

    <!-- ZONA 1: PRIMITIVAS -->
    <a-entity id="zona-primitivas" position="-3 0 -5" visible="true">
      <a-box position="-1 0.5 0" width="1.5" height="1" depth="4" color="#4CC3D9"></a-box>
      <a-cylinder position="1.5 1.5 0" radius="0.8" height="3" color="#FFC65D"></a-cylinder>
      <a-sphere position="1.5 3.2 0" radius="0.3" color="#EF2D5E"></a-sphere>
    </a-entity>

    <!-- ZONA 2: MODELO CAD GLB -->
    <a-entity 
      id="zona-cad"
      gltf-model="#modeloIndustrial" 
      position="3 0 -5" 
      scale="1 1 1"
      rotation="0 0 0"
      visible="true">
    </a-entity>

    <!-- CÁMARA CON GIROSCÓPIO -->
    <a-entity id="rigCamera" position="0 1.6 2">
      <a-camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true;" WASD-controls></a-camera>
    </a-entity>

  </a-scene>

  <!-- LÓGICA DE CONTROL -->
  <script>
    const zonaPrimitivas = document.getElementById('zona-primitivas');
    const zonaCad = document.getElementById('zona-cad');
    const sceneEl = document.querySelector('a-scene');

    function setActiveButton(btnId) {
      document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');
    }

    function mostrarTodo() {
      zonaPrimitivas.setAttribute('visible', 'true');
      zonaCad.setAttribute('visible', 'true');
      setActiveButton('btn-ambos');
    }

    function mostrarPrimitivas() {
      zonaPrimitivas.setAttribute('visible', 'true');
      zonaCad.setAttribute('visible', 'false');
      setActiveButton('btn-primitivas');
    }

    function mostrarCAD() {
      zonaPrimitivas.setAttribute('visible', 'false');
      zonaCad.setAttribute('visible', 'true');
      setActiveButton('btn-cad');
    }

    function forzarIngresoVR() {
      if (sceneEl) {
        // Dispara la acción nativa de A-Frame para ingresar a modo inmersivo/VR
        sceneEl.enterVR();
      }
    }
  </script>

</body>
</html>
